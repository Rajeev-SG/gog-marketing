profile: gogcli-check
provider: aws
class: standard
capacity:
  market: spot
  strategy: most-available
  fallback: on-demand-after-120s
  hints: true
  regions:
    - eu-west-1
    - eu-west-2
    - eu-central-1
    - us-east-1
    - us-west-2
aws:
  region: eu-west-1
  rootGB: 400
sync:
  delete: true
  checksum: false
  gitSeed: true
  fingerprint: true
  baseRef: main
  exclude:
    - .artifacts
    - .codex
    - .DS_Store
    - coverage
    - dist
    - node_modules
    - bin
env:
  allow:
    - CI
    - CGO_*
    - GOFLAGS
    - GOWORK
    - NODE_OPTIONS
    - PNPM_*
    - NPM_CONFIG_*
ssh:
  user: crabbox
  port: "2222"
