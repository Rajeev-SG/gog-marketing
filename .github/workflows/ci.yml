name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, oracle, gog-marketing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles('Makefile') }}
      - name: Install tools
        run: make tools
      - name: Format check
        run: make fmt-check
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Release CI gate tests
        run: python3 -m unittest discover -s scripts -p check_release_ci_test.py
      - name: Deadcode
        run: make deadcode
      - name: Docs, skills, and Docker version checks
        run: make docs-check agent-skills-check docker-version-check

  minimum-go:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, oracle, gog-marketing]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache: true
      - name: Test minimum supported Go series
        run: go test ./...
      - name: Build
        run: go build ./cmd/gog

  postgres:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, oracle, gog-marketing]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gog_control_plane
        ports:
          - "127.0.0.1::5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Postgres control-plane store
        env:
          CONTROL_PLANE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/gog_control_plane?sslmode=disable
        run: go test ./internal/controlplane -run '^TestPostgres' -count=1

  worker:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, oracle, gog-marketing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Enable Corepack (pnpm)
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - name: Install dependencies
        run: pnpm -C internal/tracking/worker install --frozen-lockfile
      - name: Lint
        run: pnpm -C internal/tracking/worker lint
      - name: Typecheck
        run: pnpm -C internal/tracking/worker typecheck
      - name: Build
        run: pnpm -C internal/tracking/worker build
      - name: Test
        run: pnpm -C internal/tracking/worker test

  hosted-state:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, oracle, gog-marketing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Enable Corepack (pnpm)
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - name: Install dependencies
        run: pnpm -C internal/hosted/state install --frozen-lockfile
      - name: Lint
        run: pnpm -C internal/hosted/state lint
      - name: Typecheck
        run: pnpm -C internal/hosted/state typecheck
      - name: Build
        run: pnpm -C internal/hosted/state build
      - name: Test
        run: pnpm -C internal/hosted/state test

  hosted-app:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, ARM64, oracle, gog-marketing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Enable Corepack (pnpm)
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - name: Install dependencies
        run: pnpm -C internal/hosted/app install --frozen-lockfile
      - name: Lint
        run: pnpm -C internal/hosted/app lint
      - name: Typecheck
        run: pnpm -C internal/hosted/app typecheck
      - name: Build
        run: pnpm -C internal/hosted/app build
      - name: Test
        run: pnpm -C internal/hosted/app test
