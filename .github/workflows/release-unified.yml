name: Release (Linux self-hosted)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing SemVer tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, ARM64, oracle, gog-marketing]
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
      - name: Checkout existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require green self-hosted CI on the exact tag SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/check-release-ci.py --repo "$GH_REPO" --sha "$(git rev-parse HEAD)"
      - name: Validate version and build Linux packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < internal/cmd/VERSION)" = "$VERSION"
          mkdir -p dist/linux-release
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 make build VERSION="$VERSION"
            tar -C bin -czf "dist/linux-release/gog-${VERSION}-linux-${arch}.tar.gz" gog
          done
          (cd dist/linux-release && sha256sum ./*.tar.gz > checksums.txt)
      - name: Publish Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/linux-release/* --verify-tag --title "$VERSION" --generate-notes
