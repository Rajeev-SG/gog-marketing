name: quality

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - .github/workflows/quality.yml
      - internal/hosted/app/**
      - internal/hosted/state/**
      - internal/tracking/worker/**
      - scripts/quality/**
      - docs/quality/**
      - Makefile

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, oracle, gog-marketing]
    timeout-minutes: 15
    steps:
      - name: Use disk-backed temporary storage
        run: |
          test -d "$RUNNER_TEMP"
          printf 'TMPDIR=%s\nGOTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Enable Corepack (pnpm)
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          corepack prepare pnpm@11.27.1 --activate
      - name: Install locked package dependencies
        run: |
          pnpm -C internal/hosted/app install --frozen-lockfile
          pnpm -C internal/hosted/state install --frozen-lockfile
          pnpm -C internal/tracking/worker install --frozen-lockfile
      - name: Static and duplicate quality gates
        run: make quality
