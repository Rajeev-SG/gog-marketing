rules:
  - id: go.http-command-injection
    languages: [go]
    severity: ERROR
    message: Untrusted HTTP input controls an executable or shell command.
    mode: taint
    pattern-sources:
      - pattern: $REQ.FormValue(...)
      - pattern: $REQ.PostFormValue(...)
      - pattern: $REQ.URL.Query().Get(...)
      - pattern: $REQ.Header.Get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec.Command($CMD, ...)
              - pattern: exec.CommandContext($CTX, $CMD, ...)
              - pattern: exec.Command("sh", "-c", $CMD, ...)
              - pattern: exec.CommandContext($CTX, "sh", "-c", $CMD, ...)
              - pattern: exec.Command("bash", "-c", $CMD, ...)
              - pattern: exec.CommandContext($CTX, "bash", "-c", $CMD, ...)
          - focus-metavariable: $CMD
    metadata:
      category: security
      technology: [go]

  - id: typescript.direct-code-execution
    languages: [typescript]
    severity: ERROR
    message: Direct eval or Function construction can execute untrusted code.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    metadata:
      category: security
      technology: [typescript]

